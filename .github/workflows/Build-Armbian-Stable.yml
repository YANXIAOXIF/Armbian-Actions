# Workflow Name
name: "Armbian Build Stable"

# ====================================================================
#  TRIGGERS
# ====================================================================

on:
  workflow_dispatch:
    inputs:
      BOARD:
        type: choice
        description: 'Board'
        options:
          - lemonpi
          - som3588-cat
          - ufi001c
          - uz801
          - all
        default: 'all'

      RELEASE_CHOICE:
        type: choice
        description: "Which release(s) to build"
        options:
          - default_schedule
          - all
          - bookworm
          - bullseye
          - buster
          - focal
          - jammy
          - noble
          - oracular
          - plucky
          - resolute
          - sid
          - trixie
        default: 'default_schedule'

      DESKTOP:
        type: choice
        description: "Desktop environment"
        options:
          - minimal
          - server
          - gnome
          - budgie
          - cinnamon
          - i3-wm
          - kde-neon
          - kde-plasma
          - mate
          - xfce
          - xmonad
          - minimal_and_server
        default: 'minimal'

      ENABLE_EXTENSIONS:
        type: choice
        description: "Armbian extension packages"
        options: [ 'mesa-vpu', ' ' ]
        default: " "

      DOCKER:
        type: choice
        description: "Build type: yes = Docker, no = Actions"
        required: false
        options: [ 'yes', 'no' ]
        default: 'no'
      
      NIGHTLY:
        description: "Build type: yes = Nightly, no = Stable"
        required: false
        options: [ 'yes', 'no' ]
        type: choice
        default: 'no'

      ROOTFS:
        type: choice
        description: "Root filesystem"
        options:
          - ext4
          - btrfs
        default: 'ext4'

# ====================================================================
#  PERMISSIONS & CONCURRENCY
# ====================================================================
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_SCHEDULE_RELEASES: "resolute trixie"
  ALL_RELEASES: "bookworm bullseye buster focal jammy noble oracular plucky resolute sid trixie"
  BOARD: "lemonpi som3588-cat ufi001c uz801"

# ====================================================================
#  JOBS
# ====================================================================
jobs:
  # ====================================================================
  # JOB 0: Prepare Build Parameters and Matrix 
  # ====================================================================
  Prepare_Build:
    name: "Prepare Build Parameters & Matrix"
    runs-on: ubuntu-latest
    outputs:
      BOARD: ${{ steps.normalize_params.outputs.BOARD }}
      KERNEL_BOARDS: ${{ steps.normalize_params.outputs.KERNEL_BOARDS }}
      RELEASE: ${{ steps.normalize_params.outputs.RELEASE }}
      RELEASE_STRING: ${{ steps.normalize_params.outputs.RELEASE_STRING }}
      DESKTOP: ${{ steps.normalize_params.outputs.DESKTOP }}
      ENABLE_EXTENSIONS: ${{ steps.normalize_params.outputs.ENABLE_EXTENSIONS }}
      NIGHTLY: ${{ steps.normalize_params.outputs.NIGHTLY }}
      DOCKER: ${{ steps.normalize_params.outputs.DOCKER }}
      ROOTFS: ${{ steps.normalize_params.outputs.ROOTFS }}
      VERSION: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: "Checkout OS Source to get Version"
        uses: actions/checkout@v7
        with:
          repository: armbian/os
          path: os

      - name: "Get Armbian Version"
        id: get_version
        run: |
          VERSION=$(jq -r '.version' os/nightly.json)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Armbian target version: ${VERSION}"

      - name: "Normalize & Export Matrix Parameters"
        id: normalize_params
        shell: bash
        run: |
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          INPUT_BOARD="${{ inputs.BOARD }}"
          INPUT_RELEASE="${{ inputs.RELEASE_CHOICE }}"
          INPUT_DESKTOP="${{ inputs.DESKTOP }}"

          if [ "$IS_SCHEDULE" = "true" ] || [ "$INPUT_BOARD" = "all" ] || [ -z "$INPUT_BOARD" ]; then
            BOARD_STRING="${{ env.BOARD }}"
          else
            BOARD_STRING="$INPUT_BOARD"
          fi

          KERNEL_BOARD_LIST=""
          if echo "$BOARD_STRING" | grep -Eq "lemonpi|som3588-cat"; then
            KERNEL_BOARD_LIST="${KERNEL_BOARD_LIST} lemonpi"
          fi
          if echo "$BOARD_STRING" | grep -Eq "ufi001c|uz801"; then
            KERNEL_BOARD_LIST="${KERNEL_BOARD_LIST} ufi001c"
          fi

          JSON_KERNEL_BOARDS=$(echo "$KERNEL_BOARD_LIST" | jq -c -R 'split(" ") | map(select(. != ""))')

          # 3. 确定 Release 发行版列表
          if [ "$IS_SCHEDULE" = "true" ] || [ "$INPUT_RELEASE" = "default_schedule" ] || [ -z "$INPUT_RELEASE" ]; then
            RELEASE_STRING="${{ env.DEFAULT_SCHEDULE_RELEASES }}"
          elif [ "$INPUT_RELEASE" = "all" ]; then
            RELEASE_STRING="${{ env.ALL_RELEASES }}"
          else
            RELEASE_STRING="$INPUT_RELEASE"
          fi

          if [ "$IS_SCHEDULE" = "true" ] || [ "$INPUT_DESKTOP" = "minimal_and_server" ]; then
            JSON_DESKTOP='["minimal", "server"]'
          else
            JSON_DESKTOP=$(jq -nc --arg d "${INPUT_DESKTOP:-minimal}" '[$d]')
          fi

          JSON_BOARD=$(echo "$BOARD_STRING" | jq -c -R 'split(" ") | map(select(. != ""))')
          JSON_RELEASE=$(echo "$RELEASE_STRING" | jq -c -R 'split(" ") | map(select(. != ""))')

          if [ "$IS_SCHEDULE" = "true" ]; then
            NIGHTLY="no"
            DOCKER="no"
            ROOTFS="ext4"
            EXTENSIONS=" "
          else
            NIGHTLY="${{ inputs.NIGHTLY || 'no' }}"
            DOCKER="${{ inputs.DOCKER || 'no' }}"
            ROOTFS="${{ inputs.ROOTFS || 'ext4' }}"
            EXTENSIONS="${{ inputs.ENABLE_EXTENSIONS || ' ' }}"
          fi

          echo "BOARD=${JSON_BOARD}" >> "$GITHUB_OUTPUT"
          echo "KERNEL_BOARDS=${JSON_KERNEL_BOARDS}" >> "$GITHUB_OUTPUT"
          echo "RELEASE=${JSON_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_STRING=${RELEASE_STRING}" >> "$GITHUB_OUTPUT"
          echo "DESKTOP=${JSON_DESKTOP}" >> "$GITHUB_OUTPUT"
          echo "NIGHTLY=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          echo "DOCKER=${DOCKER}" >> "$GITHUB_OUTPUT"
          echo "ROOTFS=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "ENABLE_EXTENSIONS=${EXTENSIONS}" >> "$GITHUB_OUTPUT"

          echo "=== Effective Matrix & Options ==="
          echo "Target Boards: $JSON_BOARD"
          echo "Kernel Platform Boards: $JSON_KERNEL_BOARDS"

  # ====================================================================
  # JOB 1: Build Kernel Packages
  # ====================================================================
  Build_Kernel:
    needs: Prepare_Build
    name: "Build Kernel [${{ matrix.BOARD }} ${{ matrix.BRANCH }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [edge, vendor]
        BOARD: ${{ fromJson(needs.Prepare_Build.outputs.KERNEL_BOARDS) }}

    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Checkout Board Source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false
          path: custom

      - name: "Checkout Build System"
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          clean: false
          ref: main
          path: build

      - name: "Checkout OS Source" 
        uses: actions/checkout@v7
        with:
          repository: armbian/os
          fetch-depth: 0
          clean: false
          path: os

      - name: "Setup Kernel Build Environment"
        shell: bash
        run: |
          for verdir in ./build/patch/kernel/archive/rockchip64-7.*; do
            if [ -d "$verdir" ]; then
              target=$(basename "$verdir")
              mkdir -p "./build/patch/kernel/archive/$target"
              cp -rf ./custom/Addboard/patch/kernel/archive/rockchip64-6.18/* "./build/patch/kernel/archive/$target/" || true
              echo "rockchip64 patches synced to $target"
            fi
          done
          
          mkdir -p ./build/userpatches
          cp -rf ./custom/Addboard/* ./build/ || true
          cp -rf ./os/userpatches/* ./build/userpatches/ || true

      - name: "Compile Kernel [${{ matrix.BOARD }} ${{ matrix.BRANCH }}]"
        shell: bash
        run: |
          cd ./build
          ./compile.sh \
            REVISION="${{ needs.Prepare_Build.outputs.VERSION }}" \
            BOARD="${{ matrix.BOARD }}" \
            BRANCH="${{ matrix.BRANCH }}" \
            RELEASE="bookworm" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="no" \
            BUILD_MINIMAL="yes" \
            SHARE_LOG="yes" \
            MANAGE_ACNG="no" \
            BETA="${{ needs.Prepare_Build.outputs.NIGHTLY }}" \
            PREFER_DOCKER="${{ needs.Prepare_Build.outputs.DOCKER }}" \
            EXPERT="yes" \
            VENDOR=Armbian

      - name: "Upload Kernel Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: kernel-debs-${{ matrix.BOARD }}-${{ matrix.BRANCH }}
          path: build/output/debs/*.deb
          if-no-files-found: error

  # ====================================================================
  # JOB 2: Build Armbian Image
  # ====================================================================
  Build_Image:
    name: "Build Image [${{ matrix.BOARD }} ${{ matrix.BRANCH }} ${{ matrix.RELEASE }} ${{ matrix.DESKTOP }}]"
    needs: [Prepare_Build, Build_Kernel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [ edge, vendor ]
        BOARD: ${{ fromJson(needs.Prepare_Build.outputs.BOARD) }} 
        RELEASE: ${{ fromJson(needs.Prepare_Build.outputs.RELEASE) }}
        DESKTOP: ${{ fromJson(needs.Prepare_Build.outputs.DESKTOP) }}
        exclude:
          - BOARD: ufi001c
            DESKTOP: server
          - BOARD: uz801
            DESKTOP: server

    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Checkout Board Source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false
          path: custom

      - name: "Checkout Build System"
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          clean: false
          ref: main
          path: build

      - name: "Checkout OS Source"
        uses: actions/checkout@v7
        with:
          repository: armbian/os
          fetch-depth: 0
          clean: false
          path: os

      - name: "Resolve Kernel Target"
        shell: bash
        run: |
          case "${{ matrix.BOARD }}" in
            lemonpi|som3588-cat)
              echo "KERNEL_TARGET=lemonpi" >> "$GITHUB_ENV"
              ;;
            ufi001c|uz801)
              echo "KERNEL_TARGET=ufi001c" >> "$GITHUB_ENV"
              ;;
            *)
              echo "KERNEL_TARGET=${{ matrix.BOARD }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: "Download Kernel Artifact"
        uses: actions/download-artifact@v8
        with:
          name: kernel-debs-${{ env.KERNEL_TARGET }}-${{ matrix.BRANCH }}
          path: ./prebuilt-kernel-debs

      - name: "Setup Image Build Environment"
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mkbootimg android-sdk-libsparse-utils
          
          if [[ "${{ matrix.DESKTOP }}" == "minimal" ]]; then
            echo "BUILD_DESKTOP="no"" >> $GITHUB_ENV
            echo "BUILD_MINIMAL="yes"" >> $GITHUB_ENV
          elif [[ "${{ matrix.DESKTOP }}" == "server" ]]; then
            echo "BUILD_DESKTOP="no"" >> $GITHUB_ENV
            echo "BUILD_MINIMAL="no"" >> $GITHUB_ENV
          else
            echo "BUILD_DESKTOP="yes"" >> $GITHUB_ENV
            echo "BUILD_MINIMAL="no"" >> $GITHUB_ENV
            echo "DESKTOP_ENVIRONMENT="${{ matrix.DESKTOP }}"" >> $GITHUB_ENV
            echo "DESKTOP_APPGROUPS_SELECTED="browsers"" >> $GITHUB_ENV
            echo "DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"" >> $GITHUB_ENV
          fi

          mkdir -p ./build/userpatches ./build/output/debs
          cp -rf ./custom/Addboard/* ./build/ || true
          cp -rf ./os/userpatches/* ./build/userpatches/ || true
          cp -v ./prebuilt-kernel-debs/*.deb ./build/output/debs/
          

      - name: "Compile Image [${{ matrix.BOARD }} ${{ matrix.RELEASE }}]"
        shell: bash
        run: |
          cd ./build
          ./compile.sh \
            REVISION="${{ needs.Prepare_Build.outputs.VERSION }}" \
            BOARD="${{ matrix.BOARD }}" \
            BRANCH="${{ matrix.BRANCH }}" \
            RELEASE="${{ matrix.RELEASE }}" \
            KERNEL_CONFIGURE="no" \
            kernel="no" \
            BUILD_DESKTOP="${{ env.BUILD_DESKTOP }}" \
            BUILD_MINIMAL="${{ env.BUILD_MINIMAL }}" \
            DESKTOP_ENVIRONMENT="${{ env.DESKTOP_ENVIRONMENT }}" \
            DESKTOP_APPGROUPS_SELECTED="${{ env.DESKTOP_APPGROUPS_SELECTED }}" \
            DESKTOP_ENVIRONMENT_CONFIG_NAME="${{ env.DESKTOP_ENVIRONMENT_CONFIG_NAME }}" \
            ENABLE_EXTENSIONS="${{ needs.Prepare_Build.outputs.ENABLE_EXTENSIONS }}" \
            SHARE_LOG="yes" \
            MANAGE_ACNG="no" \
            BETA="${{ needs.Prepare_Build.outputs.NIGHTLY }}" \
            PREFER_DOCKER="${{ needs.Prepare_Build.outputs.DOCKER }}" \
            ROOTFS_TYPE="${{ needs.Prepare_Build.outputs.ROOTFS }}" \
            NETWORKING_STACK="network-manager" \
            EXPERT="yes" \
            VENDOR=Armbian \
            COMPRESS_OUTPUTIMAGE="sha,gpg,xz"

      - name: "Upload Image Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.BOARD }}-${{ matrix.BRANCH }}-${{ matrix.RELEASE }}-${{ matrix.DESKTOP }}
          path: build/output/images/*
          if-no-files-found: error

  # ====================================================================
  # JOB 3: Publish GitHub Release
  # ====================================================================
  Publish_Release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [Prepare_Build, Build_Image]
    if: success()

    steps:
      - name: "Download All Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: "Consolidate Artifacts"
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p release_assets/kernels release_assets/images

          echo "--- Consolidating Kernel DEBs ---"
          find artifacts/kernel-debs-*/ -type f -name 'linux-*.deb' 2>/dev/null | while read -r filepath; do
            old_name=$(basename "$filepath")
            new_name=$(echo "$old_name" | sed -E 's/^(.*__[0-9.]+).*\.deb$/\1.deb/')
            cp -u "$filepath" "release_assets/kernels/$new_name"
          done

          echo "--- Consolidating Images ---"
          find artifacts/images-*/ -type f 2>/dev/null | while read -r img; do
            cp -u "$img" "release_assets/images/"
          done

      - name: "Generate Release Body"
        id: generate_body
        shell: bash
        run: |
          DIR_NAMES=$(find artifacts/ -mindepth 1 -maxdepth 1 -type d -name "images-*" | sed 's|^artifacts/images-||')

          BUILT_BOARDS=$(echo "$DIR_NAMES" | cut -d'-' -f1 | sort -u | paste -sd ", " -)
          BUILT_BRANCHES=$(echo "$DIR_NAMES" | cut -d'-' -f2 | sort -u | paste -sd ", " -)
          BUILT_RELEASES=$(echo "$DIR_NAMES" | cut -d'-' -f3 | sort -u | paste -sd ", " -)
          BUILT_DESKTOPS=$(echo "$DIR_NAMES" | cut -d'-' -f4 | sort -u | paste -sd ", " -)

          cat <<EOF > body.html
          <p align='center'>
            <a href='https://www.armbian.com'>
              <img src='https://raw.githubusercontent.com/armbian/.github/master/profile/tux-two.png' width='400'>
            </a>
          </p>
          <h1 align='center'>Armbian OS</h1>
          <p align='center'>
            <a href='https://www.armbian.com'><img alt='Armbian Linux stable' src='https://img.shields.io/badge/dynamic/json?label=Armbian%20Linux%20current&query=CURRENT&color=f71000&cacheSeconds=600&style=for-the-badge&url=https%3A%2F%2Fgithub.com%2Farmbian%2Fscripts%2Freleases%2Fdownload%2Fstatus%2Frunners_capacity.json'></a>
            <a href='https://www.armbian.com'><img alt='Armbian Linux rolling' src='https://img.shields.io/badge/dynamic/json?label=Armbian%20Linux%20edge&query=EDGE&color=34be5b&cacheSeconds=600&style=for-the-badge&url=https%3A%2F%2Fgithub.com%2Farmbian%2Fscripts%2Freleases%2Fdownload%2Fstatus%2Frunners_capacity.json'></a>
          </p>
          <br>
          <ul>
            <li><strong>Board</strong>: ${BUILT_BOARDS}</li>
            <li><strong>Kernel</strong>: ${BUILT_BRANCHES}</li>
            <li><strong>Desktop</strong>: ${BUILT_DESKTOPS}</li>
            <li><strong>Releases</strong>: ${BUILT_RELEASES}</li>
            <li><strong>Build Type</strong>: ${{ needs.Prepare_Build.outputs.NIGHTLY == 'yes' && 'Nightly' || 'Stable' }}</li>
            <li><strong>Verification</strong>: sha256sum and GPG signature</li>
          </ul>
          <br>
          <p>Please note that Armbian Rolling Releases are not recommended for production environments. However, in most cases, they should work well.</p>
          EOF

      - name: "Publish Final Release with All Assets"
        uses: ncipollo/release-action@v1.20.0
        with:
          tag: "Armbian_V${{ needs.Prepare_Build.outputs.VERSION }}"
          name: "Armbian_V${{ needs.Prepare_Build.outputs.VERSION }}"
          artifacts: |
            release_assets/kernels/*
            release_assets/images/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true 
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: "body.html"

  # ====================================================================
  # JOB 4: Update APT and Alpine Repository
  # ====================================================================
  Update_APT_Repo:
    name: "Update APT & Alpine Repository"
    runs-on: ubuntu-latest
    needs: [Prepare_Build, Publish_Release]
    if: success()
    env:
      GPG_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
      RELEASES: ${{ needs.Prepare_Build.outputs.RELEASE_STRING }}

    steps:
      - name: "Download all kernel DEB packages"
        uses: actions/download-artifact@v8
        with:
          pattern: kernel-debs-*
          path: artifacts/debs


      - name: "Install APT and Alpine repository tools"
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro wget binutils tar
          wget -q https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.6/x86_64/apk.static -O /tmp/apk.static
          chmod +x /tmp/apk.static
          sudo mv /tmp/apk.static /usr/local/bin/apk.static

      - name: "Setup and Populate APT Repository"
        shell: bash
        run: |
          mkdir -p repo/conf
          > repo/conf/distributions

          FAMILIES=$(for f in artifacts/debs/kernel-debs-*/*.deb; do
            [ -f "$f" ] || continue
            dpkg-deb -f "$f" Package | awk -F'-' '{print $NF}'
          done | sort -u | tr '\n' ' ')

          COMPONENTS="main ${FAMILIES}"
          echo "Discovered Platform Components: ${COMPONENTS}"

          for codename in $RELEASES; do
            cat <<EOF >> repo/conf/distributions
          Origin: Armbian
          Label: Armbian
          Codename: ${codename}
          Architectures: arm64
          Components: ${COMPONENTS}
          Description: Custom APT repository for Armbian
          SignWith: ${{ env.GPG_KEY_ID }}

          EOF
          done

          echo "--- APT distributions config ---"
          cat repo/conf/distributions

          for deb in artifacts/debs/kernel-debs-*/*.deb; do
            [ -f "$deb" ] || continue
            FAMILY=$(dpkg-deb -f "$deb" Package | awk -F'-' '{print $NF}')
            [ -z "$FAMILY" ] && FAMILY="main"

            for codename in $RELEASES; do
              reprepro -b repo/ -V \
                --ignore=wrongdistribution \
                --ignore=wrongarchitecture \
                -C "${FAMILY}" \
                includedeb "${codename}" "$deb"
            done
          done

      - name: "Setup and Populate Alpine Repository"
        shell: bash
        run: |
          for deb in artifacts/debs/kernel-debs-*/linux-image-*.deb; do
            [ -f "$deb" ] || continue

            PKG_NAME=$(dpkg-deb -f "$deb" Package) # 例: linux-image-edge-qcom64
            BRANCH=$(echo "$PKG_NAME" | awk -F'-' '{print $(NF-1)}') # edge / vendor
            FAMILY=$(echo "$PKG_NAME" | awk -F'-' '{print $NF}')     # qcom64 / rockchip64

            TARGET_DIR="./repo/alpine/${FAMILY}/aarch64"
            mkdir -p "$TARGET_DIR"

            TMP_ROOT="/tmp/apk_${FAMILY}_${BRANCH}"
            rm -rf "$TMP_ROOT" && mkdir -p "$TMP_ROOT"

            tmp_pkg=$(mktemp -d)
            ar -x "$deb" --output "$tmp_pkg"
            tar -xf "$tmp_pkg"/data.tar.* -C "$TMP_ROOT" || true
            rm -rf "$tmp_pkg"

            DTB_DIR=$(dirname "$deb")
            for dtb_deb in "$DTB_DIR"/linux-dtb-${BRANCH}-${FAMILY}*.deb; do
              if [ -f "$dtb_deb" ]; then
                tmp_dtb=$(mktemp -d)
                ar -x "$dtb_deb" --output "$tmp_dtb"
                tar -xf "$tmp_dtb"/data.tar.* -C "$TMP_ROOT" || true
                rm -rf "$tmp_dtb"
              fi
            done

            REAL_KVER=$(ls -1 "$TMP_ROOT/lib/modules" 2>/dev/null | head -n 1)
            [ -z "$REAL_KVER" ] && { rm -rf "$TMP_ROOT"; continue; }

            APK_NAME="linux-${BRANCH}-${FAMILY}"

            cat <<EOF > "$TMP_ROOT/.PKGINFO"
            pkgname = ${APK_NAME}
            pkgver = ${REAL_KVER}-r0
            pkgdesc = Universal Linux Kernel (${BRANCH}) and DTBs for ${FAMILY}
            url = ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
            builddate = $(date +%s)
            packager = GitHub Actions (${GITHUB_ACTOR})
            size = $(du -sb "$TMP_ROOT" | cut -f1)
            arch = aarch64
            origin = ${APK_NAME}
            EOF

            TARGET_DIRS=""
            for d in boot lib usr etc; do
              [ -d "$TMP_ROOT/$d" ] && TARGET_DIRS="$TARGET_DIRS $d"
            done

            tar -czf "${TARGET_DIR}/${APK_NAME}-${REAL_KVER}.apk" -C "$TMP_ROOT" .PKGINFO $TARGET_DIRS
            rm -rf "$TMP_ROOT"
          done

          for fam_dir in ./repo/alpine/*; do
            ARCH_DIR="$fam_dir/aarch64"
            if [ -d "$ARCH_DIR" ]; then
              cd "$ARCH_DIR"
              if ls *.apk >/dev/null 2>&1; then
                apk.static index -o APKINDEX.tar.gz *.apk
                echo "Generated APKINDEX for $(basename "$fam_dir")"
              fi
              cd - >/dev/null
            fi
          done

      - name: "Deploy repository to GitHub Pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: apt-repo
          force_orphan: true
