name: "Armbian Build Stable"

# ====================================================================
# TRIGGERS
# ====================================================================
on:
  schedule:
    # Trigger automatically at 00:00 UTC on the 1st and 15th of each month
    - cron: '0 0 1,15 * *'

  workflow_dispatch:
    inputs:
      BOARD:
        description: 'Target Board'
        type: choice
        options:
          - lemonpi
          - som3588-cat
          - ufi001c
          - uz801
          - all
        default: 'all'

      BRANCH:
        description: "Kernel Branch"
        type: choice
        options:
          - edge
          - vendor
          - all
        default: 'edge'

      RELEASE:
        description: "OS Release"
        type: choice
        options:
          - default_schedule
          - all
          - bookworm
          - bullseye
          - focal
          - jammy
          - noble
          - oracular
          - plucky
          - resolute
          - trixie
        default: 'default_schedule'

      DESKTOP:
        description: "Desktop Environment"
        type: choice
        options:
          - minimal
          - server
          - minimal_and_server
          - xfce
          - gnome
        default: 'minimal'

      ENABLE_EXTENSIONS:
        description: "Armbian Extensions"
        type: choice
        options:
          - 'mesa-vpu'
          - ' '
        default: ' '

      DOCKER:
        description: "Build using Docker container"
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

      NIGHTLY:
        description: "Nightly Build"
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

      ROOTFS:
        description: "Root Filesystem"
        type: choice
        options:
          - ext4
          - btrfs
        default: 'ext4'

# ====================================================================
# PERMISSIONS & CONCURRENCY
# ====================================================================
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ALL_BOARDS: "lemonpi som3588-cat ufi001c uz801"
  SCHEDULE_RELEASES: "resolute trixie"
  ALL_RELEASES: "bookworm bullseye buster focal jammy noble oracular plucky resolute sid trixie"

# ====================================================================
# JOBS
# ====================================================================
jobs:
  # ====================================================================
  # JOB 0: Prepare Build Parameters and Matrix
  # ====================================================================
  Prepare_Build:
    name: "Prepare Build Parameters"
    runs-on: ubuntu-latest
    outputs:
      BOARD: ${{ steps.parse.outputs.BOARD }}
      BRANCH: ${{ steps.parse.outputs.BRANCH }}
      KERNEL_BOARDS: ${{ steps.parse.outputs.KERNEL_BOARDS }}
      RELEASE: ${{ steps.parse.outputs.RELEASE }}
      DESKTOP: ${{ steps.parse.outputs.DESKTOP }}
      EXTENSIONS: ${{ steps.parse.outputs.EXTENSIONS }}
      NIGHTLY: ${{ steps.parse.outputs.NIGHTLY }}
      DOCKER: ${{ steps.parse.outputs.DOCKER }}
      ROOTFS: ${{ steps.parse.outputs.ROOTFS }}
      VERSION: ${{ steps.parse.outputs.VERSION }}

    steps:
      - name: "Parse and Normalize Parameters"
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          IS_SCHED="${{ github.event_name == 'schedule' }}"

          # 1. Fetch current Armbian release version from upstream
          ARMBIAN_VER=$(curl -fsSL https://raw.githubusercontent.com/armbian/build/main/VERSION || echo "24.05.0")
          echo "VERSION=${ARMBIAN_VER}" >> "$GITHUB_OUTPUT"
          echo "Armbian Version: ${ARMBIAN_VER}"

          # 2. Kernel Branch normalization (Default: edge)
          IN_BRANCH="${{ inputs.BRANCH }}"
          if [ "$IS_SCHED" = "true" ] || [ -z "$IN_BRANCH" ]; then
            BRANCH_STR="edge"
          elif [ "$IN_BRANCH" = "all" ]; then
            BRANCH_STR="edge vendor"
          else
            BRANCH_STR="$IN_BRANCH"
          fi
          echo "BRANCH=$(echo "$BRANCH_STR" | jq -c -R 'split(" ")')" >> "$GITHUB_OUTPUT"

          # 3. Target boards normalization
          IN_BOARD="${{ inputs.BOARD }}"
          if [ "$IS_SCHED" = "true" ] || [ "$IN_BOARD" = "all" ] || [ -z "$IN_BOARD" ]; then
            BOARD_LIST="${{ env.ALL_BOARDS }}"
          else
            BOARD_LIST="$IN_BOARD"
          fi
          echo "BOARD=$(echo "$BOARD_LIST" | jq -c -R 'split(" ")')" >> "$GITHUB_OUTPUT"

          # 4. Mapping compatible boards for kernel compilation deduplication
          K_LIST=""
          echo "$BOARD_LIST" | grep -Eq "lemonpi|som3588-cat" && K_LIST="${K_LIST} lemonpi"
          echo "$BOARD_LIST" | grep -Eq "ufi001c|uz801" && K_LIST="${K_LIST} ufi001c"
          echo "KERNEL_BOARDS=$(echo "$K_LIST" | jq -c -R 'split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

          # 5. Target OS release distributions
          IN_RELEASE="${{ inputs.RELEASE }}"
          if [ "$IS_SCHED" = "true" ] || [ "$IN_RELEASE" = "default_schedule" ] || [ -z "$IN_RELEASE" ]; then
            REL_STR="${{ env.SCHEDULE_RELEASES }}"
          elif [ "$IN_RELEASE" = "all" ]; then
            REL_STR="${{ env.ALL_RELEASES }}"
          else
            REL_STR="$IN_RELEASE"
          fi
          echo "RELEASE=$(echo "$REL_STR" | jq -c -R 'split(" ")')" >> "$GITHUB_OUTPUT"

          # 6. Desktop environment selection
          IN_DESKTOP="${{ inputs.DESKTOP }}"
          if [ "$IN_DESKTOP" = "minimal_and_server" ]; then
            echo 'DESKTOP=["minimal", "server"]' >> "$GITHUB_OUTPUT"
          else
            TARGET_DESK="${IN_DESKTOP:-minimal}"
            echo "DESKTOP=$(jq -nc --arg d "$TARGET_DESK" '[$d]')" >> "$GITHUB_OUTPUT"
          fi

          # 7. General configuration flags
          echo "NIGHTLY=${{ inputs.NIGHTLY || 'no' }}" >> "$GITHUB_OUTPUT"
          echo "DOCKER=${{ inputs.DOCKER || 'no' }}" >> "$GITHUB_OUTPUT"
          echo "ROOTFS=${{ inputs.ROOTFS || 'ext4' }}" >> "$GITHUB_OUTPUT"
          echo "EXTENSIONS=${{ inputs.ENABLE_EXTENSIONS || ' ' }}" >> "$GITHUB_OUTPUT"

  # ====================================================================
  # JOB 1: Build Kernel Packages
  # ====================================================================
  Build_Kernel:
    name: "Build Kernel [${{ matrix.BOARD == 'lemonpi' && 'Rockchip' || (matrix.BOARD == 'ufi001c' && 'Qualcomm' || matrix.BOARD) }} ${{ matrix.BRANCH }}]"
    needs: Prepare_Build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        BOARD: ${{ fromJson(needs.Prepare_Build.outputs.KERNEL_BOARDS) }}
        BRANCH: ${{ fromJson(needs.Prepare_Build.outputs.BRANCH) }}

    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Checkout Board Customizations"
        uses: actions/checkout@v7
        with:
          path: custom

      - name: "Checkout Build Framework"
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          path: build

      - name: "Setup Kernel Build Patches"
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for verdir in ./build/patch/kernel/archive/rockchip64-7.*; do
            if [ -d "$verdir" ]; then
              target=$(basename "$verdir")
              mkdir -p "./build/patch/kernel/archive/$target"
              cp -rf ./custom/Addboard/patch/kernel/archive/rockchip64-6.18/* "./build/patch/kernel/archive/$target/" || true
              echo "rockchip64 patches synced to $target"
            fi
          done
          shopt -u nullglob

          mkdir -p ./build/userpatches
          [ -d ./custom/Addboard ] && cp -rf ./custom/Addboard/* ./build/ || true
          [ -d ./os/userpatches ] && cp -rf ./os/userpatches/* ./build/userpatches/ || true

      - name: "Compile Kernel"
        shell: bash
        run: |
          cd ./build
          ./compile.sh \
            REVISION="${{ needs.Prepare_Build.outputs.VERSION }}" \
            BOARD="${{ matrix.BOARD }}" \
            BRANCH="${{ matrix.BRANCH }}" \
            RELEASE="bookworm" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="no" \
            BUILD_MINIMAL="yes" \
            SHARE_LOG="yes" \
            MANAGE_ACNG="no" \
            BETA="${{ needs.Prepare_Build.outputs.NIGHTLY }}" \
            PREFER_DOCKER="${{ needs.Prepare_Build.outputs.DOCKER }}" \
            EXPERT="yes" \
            VENDOR=Armbian

      - name: "Upload Kernel Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: kernel-debs-${{ matrix.BOARD }}-${{ matrix.BRANCH }}
          path: build/output/debs/*.deb
          if-no-files-found: error

  # ====================================================================
  # JOB 2: Build Armbian OS Image
  # ====================================================================
  Build_Image:
    name: "Build Image [${{ matrix.BOARD }} ${{ matrix.BRANCH }} ${{ matrix.RELEASE }} ${{ matrix.DESKTOP }}]"
    needs: [Prepare_Build, Build_Kernel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        BOARD: ${{ fromJson(needs.Prepare_Build.outputs.BOARD) }}
        BRANCH: ${{ fromJson(needs.Prepare_Build.outputs.BRANCH) }}
        RELEASE: ${{ fromJson(needs.Prepare_Build.outputs.RELEASE) }}
        DESKTOP: ${{ fromJson(needs.Prepare_Build.outputs.DESKTOP) }}
        exclude:
          - BOARD: ufi001c
            DESKTOP: server
          - BOARD: uz801
            DESKTOP: server

    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "Checkout Board Customizations"
        uses: actions/checkout@v7
        with:
          path: custom

      - name: "Checkout Build Framework"
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          path: build

      - name: "Checkout OS Source"
        uses: actions/checkout@v7
        with:
          repository: armbian/os
          path: os

      - name: "Resolve Kernel Target"
        shell: bash
        run: |
          case "${{ matrix.BOARD }}" in
            lemonpi|som3588-cat) echo "KERNEL_TARGET=lemonpi" >> "$GITHUB_ENV" ;;
            ufi001c|uz801)       echo "KERNEL_TARGET=ufi001c" >> "$GITHUB_ENV" ;;
            *)                   echo "KERNEL_TARGET=${{ matrix.BOARD }}" >> "$GITHUB_ENV" ;;
          esac

      - name: "Download Prebuilt Kernel DEBs"
        uses: actions/download-artifact@v8
        with:
          name: kernel-debs-${{ env.KERNEL_TARGET }}-${{ matrix.BRANCH }}
          path: ./prebuilt-kernel-debs

      - name: "Setup Image Build Environment"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mkbootimg android-sdk-libsparse-utils

          if [ "${{ matrix.DESKTOP }}" = "minimal" ]; then
            echo "BUILD_DESKTOP=no" >> "$GITHUB_ENV"
            echo "BUILD_MINIMAL=yes" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT=" >> "$GITHUB_ENV"
            echo "DESKTOP_APPGROUPS_SELECTED=" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT_CONFIG_NAME=" >> "$GITHUB_ENV"
          elif [ "${{ matrix.DESKTOP }}" = "server" ]; then
            echo "BUILD_DESKTOP=no" >> "$GITHUB_ENV"
            echo "BUILD_MINIMAL=no" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT=" >> "$GITHUB_ENV"
            echo "DESKTOP_APPGROUPS_SELECTED=" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT_CONFIG_NAME=" >> "$GITHUB_ENV"
          else
            echo "BUILD_DESKTOP=yes" >> "$GITHUB_ENV"
            echo "BUILD_MINIMAL=no" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT=${{ matrix.DESKTOP }}" >> "$GITHUB_ENV"
            echo "DESKTOP_APPGROUPS_SELECTED=browsers" >> "$GITHUB_ENV"
            echo "DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base" >> "$GITHUB_ENV"
          fi

          mkdir -p ./build/userpatches ./build/output/debs
          [ -d ./custom/Addboard ] && cp -rf ./custom/Addboard/* ./build/ || true
          [ -d ./os/userpatches ] && cp -rf ./os/userpatches/* ./build/userpatches/ || true
          cp -v ./prebuilt-kernel-debs/*.deb ./build/output/debs/

      - name: "Import GPG Key for Signing Images"
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.ARMBIAN_PRIVATE_KEY }}
          passphrase: ${{ secrets.ARMBIAN_PASSPHRASE }}

      - name: "Compile Armbian Image"
        shell: bash
        run: |
          cd ./build
          ./compile.sh \
            REVISION="${{ needs.Prepare_Build.outputs.VERSION }}" \
            BOARD="${{ matrix.BOARD }}" \
            BRANCH="${{ matrix.BRANCH }}" \
            RELEASE="${{ matrix.RELEASE }}" \
            KERNEL_CONFIGURE="no" \
            kernel="no" \
            BUILD_DESKTOP="${{ env.BUILD_DESKTOP }}" \
            BUILD_MINIMAL="${{ env.BUILD_MINIMAL }}" \
            DESKTOP_ENVIRONMENT="${{ env.DESKTOP_ENVIRONMENT }}" \
            DESKTOP_APPGROUPS_SELECTED="${{ env.DESKTOP_APPGROUPS_SELECTED }}" \
            DESKTOP_ENVIRONMENT_CONFIG_NAME="${{ env.DESKTOP_ENVIRONMENT_CONFIG_NAME }}" \
            ENABLE_EXTENSIONS="${{ needs.Prepare_Build.outputs.EXTENSIONS }}" \
            SHARE_LOG="yes" \
            MANAGE_ACNG="no" \
            BETA="${{ needs.Prepare_Build.outputs.NIGHTLY }}" \
            PREFER_DOCKER="${{ needs.Prepare_Build.outputs.DOCKER }}" \
            ROOTFS_TYPE="${{ needs.Prepare_Build.outputs.ROOTFS }}" \
            NETWORKING_STACK="network-manager" \
            EXPERT="yes" \
            VENDOR=Armbian \
            COMPRESS_OUTPUTIMAGE="sha,gpg,xz"

      - name: "Upload Image Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.BOARD }}-${{ matrix.BRANCH }}-${{ matrix.RELEASE }}-${{ matrix.DESKTOP }}
          path: build/output/images/*
          if-no-files-found: error

  # ====================================================================
  # JOB 3: Publish GitHub Release
  # ====================================================================
  Publish_Release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [Prepare_Build, Build_Image]
    if: success()

    steps:
      - name: "Download All Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: "Consolidate Artifacts"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets/kernels release_assets/images

          echo "===> Consolidating Kernel DEBs"
          find artifacts/ -type f -path '*/kernel-debs-*/*' -name 'linux-*.deb' 2>/dev/null | while read -r filepath; do
            old_name=$(basename "$filepath")
            new_name=$(echo "$old_name" | sed -E 's/^(.*__[0-9.]+).*\.deb$/\1.deb/')
            cp -u "$filepath" "release_assets/kernels/$new_name"
          done

          echo "===> Consolidating Images"
          find artifacts/ -type f -path '*/images-*/*' 2>/dev/null | while read -r img; do
            cp -u "$img" "release_assets/images/"
          done

      - name: "Generate Release Notes"
        id: generate_body
        shell: bash
        run: |
          set -euo pipefail
          DIR_NAMES=$(find artifacts/ -mindepth 1 -maxdepth 1 -type d -name "images-*" | sed 's|^artifacts/images-||' || true)

          BUILT_BOARDS=$(echo "$DIR_NAMES" | cut -d'-' -f1 | sort -u | paste -sd ", " -)
          BUILT_BRANCHES=$(echo "$DIR_NAMES" | cut -d'-' -f2 | sort -u | paste -sd ", " -)
          BUILT_RELEASES=$(echo "$DIR_NAMES" | cut -d'-' -f3 | sort -u | paste -sd ", " -)
          BUILT_DESKTOPS=$(echo "$DIR_NAMES" | cut -d'-' -f4 | sort -u | paste -sd ", " -)

          cat <<EOF > body.html
          <p align='center'>
            <a href='https://www.armbian.com'>
              <img src='https://raw.githubusercontent.com/armbian/.github/master/profile/tux-two.png' width='400' alt='Armbian Logo'>
            </a>
          </p>
          <h1 align='center'>Armbian OS</h1>
          <p align='center'>
            <a href='https://www.armbian.com'><img alt='Armbian Linux stable' src='https://img.shields.io/badge/dynamic/json?label=Armbian%20Linux%20current&query=CURRENT&color=f71000&cacheSeconds=600&style=for-the-badge&url=https%3A%2F%2Fgithub.com%2Farmbian%2Fscripts%2Freleases%2Fdownload%2Fstatus%2Frunners_capacity.json'></a>
            <a href='https://www.armbian.com'><img alt='Armbian Linux rolling' src='https://img.shields.io/badge/dynamic/json?label=Armbian%20Linux%20edge&query=EDGE&color=34be5b&cacheSeconds=600&style=for-the-badge&url=https%3A%2F%2Fgithub.com%2Farmbian%2Fscripts%2Freleases%2Fdownload%2Fstatus%2Frunners_capacity.json'></a>
          </p>
          <br>
          <ul>
            <li><strong>Board</strong>: ${BUILT_BOARDS}</li>
            <li><strong>Kernel</strong>: ${BUILT_BRANCHES}</li>
            <li><strong>Desktop</strong>: ${BUILT_DESKTOPS}</li>
            <li><strong>Releases</strong>: ${BUILT_RELEASES}</li>
            <li><strong>Build Type</strong>: ${{ needs.Prepare_Build.outputs.NIGHTLY == 'yes' && 'Nightly' || 'Stable' }}</li>
            <li><strong>Verification</strong>: SHA256 checksums and GPG signatures</li>
          </ul>
          <br>
          <p>Please note that Armbian Rolling Releases are not recommended for production environments. However, in most cases, they should work well.</p>
          EOF

      - name: "Publish Final Release with All Assets"
        uses: ncipollo/release-action@v1
        with:
          tag: "Armbian_V${{ needs.Prepare_Build.outputs.VERSION }}"
          name: "Armbian_V${{ needs.Prepare_Build.outputs.VERSION }}"
          artifacts: |
            release_assets/kernels/*
            release_assets/images/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: "body.html"

  # ====================================================================
  # JOB 4: Update APT and Alpine Repository
  # ====================================================================
  Update_APT_Repo:
    name: "Update APT & Alpine Repository"
    runs-on: ubuntu-latest
    needs: [Prepare_Build, Publish_Release]
    if: success()
    env:
      GPG_KEY_ID: ${{ secrets.ARMBIAN_KEY_ID }}

    steps:
      - name: "Download Kernel Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: kernel-debs-*
          path: artifacts/debs
          merge-multiple: true

      - name: "Import GPG Key for APT"
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.ARMBIAN_PRIVATE_KEY }}
          passphrase: ${{ secrets.ARMBIAN_PASSPHRASE }}

      - name: "Install APT and Modern Alpine Tools"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro wget binutils tar openssl jq

          echo "===> Installing apk-tools v3 static binary"
          sudo wget -qO /usr/local/bin/apk.static https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.0_pre4/x86_64/apk.static
          sudo chmod +x /usr/local/bin/apk.static
          /usr/local/bin/apk.static --version || true

      - name: "Setup and Populate APT Repository"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/conf
          : > repo/conf/distributions

          # Identify all kernel family packages
          FAMILIES=$(find artifacts/debs/ -type f -name 'linux-image-*.deb' -exec dpkg-deb -f {} Package \; 2>/dev/null | sed -E 's/^linux-image-[^-]+-//' | sort -u | tr '\n' ' ' || true)
          COMPONENTS="main ${FAMILIES}"

          RELEASES="${{ join(fromJson(needs.Prepare_Build.outputs.RELEASE), ' ') }}"

          for codename in $RELEASES; do
            {
              echo "Origin: Armbian"
              echo "Label: Armbian"
              echo "Codename: ${codename}"
              echo "Architectures: arm64"
              echo "Components: ${COMPONENTS}"
              echo "Description: Custom APT repository for Armbian"
              [ -n "${GPG_KEY_ID}" ] && echo "SignWith: ${GPG_KEY_ID}"
              echo ""
            } >> repo/conf/distributions
          done

          find artifacts/debs/ -type f -name '*.deb' | while read -r deb; do
            PKG_NAME=$(dpkg-deb -f "$deb" Package)

            TARGET_COMP="main"
            for fam in ${FAMILIES}; do
              if [[ "$PKG_NAME" == *"$fam"* ]]; then
                TARGET_COMP="$fam"
                break
              fi
            done

            for codename in $RELEASES; do
              reprepro -b repo/ -V \
                --ignore=wrongdistribution \
                --ignore=wrongarchitecture \
                -C "${TARGET_COMP}" \
                includedeb "${codename}" "$deb"
            done
          done

      - name: "Build and Sign Alpine Repository (APK v3 Spec)"
        shell: bash
        run: |
          set -euo pipefail
          HAS_ALPINE_KEY="false"
          KEY_NAME="alpine-actions.rsa.pub"

          if [ -n "${{ secrets.ALPINE_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.ALPINE_PRIVATE_KEY }}" > /tmp/alpine.rsa
            chmod 600 /tmp/alpine.rsa
            mkdir -p ./repo/alpine
            openssl rsa -in /tmp/alpine.rsa -pubout -out "./repo/alpine/${KEY_NAME}" 2>/dev/null || true
            HAS_ALPINE_KEY="true"
            echo "Private signing key loaded. Public key exported to ./repo/alpine/${KEY_NAME}"
          else
            echo "ALPINE_PRIVATE_KEY not configured. Running in untrusted mode."
          fi

          find artifacts/debs/ -type f -name 'linux-image-*.deb' | while read -r deb; do
            PKG_NAME=$(dpkg-deb -f "$deb" Package)
            BRANCH=$(echo "$PKG_NAME" | awk -F'-' '{print $(NF-1)}')
            FAMILY=$(echo "$PKG_NAME" | awk -F'-' '{print $NF}')

            TARGET_DIR="./repo/alpine/${FAMILY}/aarch64"
            mkdir -p "$TARGET_DIR"

            TMP_ROOT="/tmp/apk_${FAMILY}_${BRANCH}"
            rm -rf "$TMP_ROOT" && mkdir -p "$TMP_ROOT"

            tmp_pkg=$(mktemp -d)
            ar -x "$deb" --output "$tmp_pkg"
            tar -xf "$tmp_pkg"/data.tar.* -C "$TMP_ROOT" || true
            rm -rf "$tmp_pkg"

            DTB_DIR=$(dirname "$deb")
            for dtb_deb in "$DTB_DIR"/linux-dtb-${BRANCH}-${FAMILY}*.deb; do
              if [ -f "$dtb_deb" ]; then
                tmp_dtb=$(mktemp -d)
                ar -x "$dtb_deb" --output "$tmp_dtb"
                tar -xf "$tmp_dtb"/data.tar.* -C "$TMP_ROOT" || true
                rm -rf "$tmp_dtb"
              fi
            done

            REAL_KVER=$(ls -1 "$TMP_ROOT/lib/modules" 2>/dev/null | head -n 1 || true)
            [ -z "$REAL_KVER" ] && { rm -rf "$TMP_ROOT"; continue; }

            CLEAN_KVER=$(echo "$REAL_KVER" | sed "s/-${BRANCH}-${FAMILY}$//" | sed 's/-rc/_rc/')
            PKG_VER="${CLEAN_KVER}-r1"
            APK_NAME="linux-${BRANCH}-${FAMILY}"
            OUTPUT_APK="${TARGET_DIR}/${APK_NAME}-${PKG_VER}.apk"

            MKPKG_ARGS=(
              --info "name:${APK_NAME}"
              --info "version:${PKG_VER}"
              --info "description:Universal Linux Kernel (${BRANCH}) and DTBs for ${FAMILY}"
              --info "arch:aarch64"
              --info "origin:${APK_NAME}"
              --info "url:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
              --files "$TMP_ROOT"
              --output "$OUTPUT_APK"
            )

            [ "$HAS_ALPINE_KEY" = "true" ] && MKPKG_ARGS+=(--sign-key /tmp/alpine.rsa)
            
            rm -rf "$TMP_ROOT/etc" "$TMP_ROOT/usr/share" "$TMP_ROOT"/boot/System.map-* "$TMP_ROOT"/boot/config-*
            apk.static mkpkg "${MKPKG_ARGS[@]}"
            echo "Successfully generated APK: $OUTPUT_APK"

            rm -rf "$TMP_ROOT"
          done

          # Generate index (APKINDEX) for each repository architecture
          shopt -s nullglob
          for fam_dir in ./repo/alpine/*; do
            ARCH_DIR="$fam_dir/aarch64"
            if [ -d "$ARCH_DIR" ]; then
              cd "$ARCH_DIR"
              apk_files=(*.apk)
              if [ ${#apk_files[@]} -gt 0 ]; then
                rm -f Packages.adb packages.adb APKINDEX.*
                if [ "$HAS_ALPINE_KEY" = "true" ]; then
                  echo "Generating signed APKINDEX (v3 adb) for $(basename "$fam_dir")..."
                  apk.static mkndx \
                    --allow-untrusted \
                    --sign-key /tmp/alpine.rsa \
                    --output Packages.adb \
                    *.apk
                else
                  echo "Generating unsigned test APKINDEX (v3 adb) for $(basename "$fam_dir")..."
                  apk.static mkndx \
                    --allow-untrusted \
                    --output Packages.adb \
                    *.apk
                fi
                ln -sf Packages.adb packages.adb
              fi
              cd - >/dev/null
            fi
          done
          shopt -u nullglob

          rm -f /tmp/alpine.rsa
          rm -rf repo/db repo/conf

      - name: "Deploy GitHub Pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: pages
          force_orphan: true
