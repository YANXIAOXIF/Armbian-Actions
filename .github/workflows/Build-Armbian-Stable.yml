# 2. 构建并正确签名 Alpine 源
      # ---------------------------------------------------------------
      - name: "Setup and Populate Alpine Repository"
        shell: bash
        run: |
          set -e
          HAS_ALPINE_KEY="false"
          KEY_NAME="alpine-actions.rsa.pub"

          if [ -n "${{ secrets.ALPINE_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.ALPINE_PRIVATE_KEY }}" > /tmp/alpine.rsa
            chmod 600 /tmp/alpine.rsa
            
            mkdir -p ./repo/alpine
            openssl rsa -in /tmp/alpine.rsa -pubout -out "./repo/alpine/${KEY_NAME}" 2>/dev/null || true
            HAS_ALPINE_KEY="true"
            echo "成功载入 ALPINE_PRIVATE_KEY，已导出公钥 ${KEY_NAME}"
          else
            echo "未配置 ALPINE_PRIVATE_KEY，生成免签索引 (测试模式)"
          fi

          # 2. 从 DEB 包解包构建 APK
          for deb in artifacts/debs/kernel-debs-*/linux-image-*.deb; do
            [ -f "$deb" ] || continue

            PKG_NAME=$(dpkg-deb -f "$deb" Package)
            BRANCH=$(echo "$PKG_NAME" | awk -F'-' '{print $(NF-1)}')
            FAMILY=$(echo "$PKG_NAME" | awk -F'-' '{print $NF}')

            TARGET_DIR="./repo/alpine/${FAMILY}/aarch64"
            mkdir -p "$TARGET_DIR"

            TMP_ROOT="/tmp/apk_${FAMILY}_${BRANCH}"
            rm -rf "$TMP_ROOT" && mkdir -p "$TMP_ROOT"

            tmp_pkg=$(mktemp -d)
            ar -x "$deb" --output "$tmp_pkg"
            tar -xf "$tmp_pkg"/data.tar.* -C "$TMP_ROOT" || true
            rm -rf "$tmp_pkg"

            DTB_DIR=$(dirname "$deb")
            for dtb_deb in "$DTB_DIR"/linux-dtb-${BRANCH}-${FAMILY}*.deb; do
              if [ -f "$dtb_deb" ]; then
                tmp_dtb=$(mktemp -d)
                ar -x "$dtb_deb" --output "$tmp_dtb"
                tar -xf "$tmp_dtb"/data.tar.* -C "$TMP_ROOT" || true
                rm -rf "$tmp_dtb"
              fi
            done

            REAL_KVER=$(ls -1 "$TMP_ROOT/lib/modules" 2>/dev/null | head -n 1)
            [ -z "$REAL_KVER" ] && { rm -rf "$TMP_ROOT"; continue; }

            # 将 -rc 替换为 _rc (Alpine 仅支持下划线表示候选版)
            CLEAN_KVER=$(echo "$REAL_KVER" | sed "s/-${BRANCH}-${FAMILY}$//" | sed 's/-rc/_rc/')

            # 关键：严格定义带有 -r0 的 PKG_VER
            PKG_VER="${CLEAN_KVER}-r0"
            APK_NAME="linux-${BRANCH}-${FAMILY}"

            # 写入标准的 .PKGINFO
            {
              echo "pkgname = ${APK_NAME}"
              echo "pkgver = ${PKG_VER}"
              echo "pkgdesc = Universal Linux Kernel (${BRANCH}) and DTBs for ${FAMILY}"
              echo "url = ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
              echo "builddate = $(date +%s)"
              echo "packager = GitHub Actions (${GITHUB_ACTOR})"
              echo "size = $(du -sb "$TMP_ROOT" | cut -f1)"
              echo "arch = aarch64"
              echo "origin = ${APK_NAME}"
            } > "$TMP_ROOT/.PKGINFO"

            TARGET_DIRS=""
            for d in boot lib usr etc; do
              [ -d "$TMP_ROOT/$d" ] && TARGET_DIRS="$TARGET_DIRS $d"
            done

            # 【关键修复点】：文件名必须使用 ${PKG_VER}，这样就会带有 -r0.apk
            tar -czf "${TARGET_DIR}/${APK_NAME}-${PKG_VER}.apk" -C "$TMP_ROOT" .PKGINFO $TARGET_DIRS
            echo "已生成: ${TARGET_DIR}/${APK_NAME}-${PKG_VER}.apk"

            rm -rf "$TMP_ROOT"
          done

          # 3. 生成索引与签名
          for fam_dir in ./repo/alpine/*; do
            ARCH_DIR="$fam_dir/aarch64"
            if [ -d "$ARCH_DIR" ]; then
              cd "$ARCH_DIR"
              if ls *.apk >/dev/null 2>&1; then
                # 清理旧的索引避免冲突
                rm -f APKINDEX.*

                apk.static index --allow-untrusted -o APKINDEX.unsigned.tar.gz *.apk

                if [ "$HAS_ALPINE_KEY" = "true" ]; then
                  echo "正在使用 OpenSSL 私钥对 $(basename "$fam_dir") 的 APKINDEX 注入签名..."
                  
                  TMP_SIGN_DIR=$(mktemp -d)
                  tar -xzf APKINDEX.unsigned.tar.gz -C "$TMP_SIGN_DIR"
                  
                  openssl dgst -sha256 -sign /tmp/alpine.rsa -out "$TMP_SIGN_DIR/.SIGN.RSA.${KEY_NAME}" "$TMP_SIGN_DIR/APKINDEX"
                  
                  tar -czf APKINDEX.tar.gz -C "$TMP_SIGN_DIR" ".SIGN.RSA.${KEY_NAME}" APKINDEX
                  
                  rm -rf "$TMP_SIGN_DIR" APKINDEX.unsigned.tar.gz
                  echo "签名注入完成！"
                else
                  mv APKINDEX.unsigned.tar.gz APKINDEX.tar.gz
                fi
              fi
              cd - >/dev/null
            fi
          done

          # 清理私钥
          rm -f /tmp/alpine.rsa
